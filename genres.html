<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MovieZone - Genres</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            🎬 MovieZone
        </div>

        <nav>
            <a href="index.html">Home</a>
            <a href="movies.html">Movies</a>
            <a href="genres.html">Genres</a>
            <a href="watchlist.html">Watchlist</a>
            <a href="login.html">Sign In</a>
        </nav>

    </header>


    <main class="movies">

        <div class="section-title">
            <h2>🎭 Movie Genres</h2>

            <a href="index.html">
                ← Home
            </a>
        </div>


        <div class="genre-filter">

            <button onclick="filterMovies('all')">All</button>

            <button onclick="filterMovies('Action')">
                🔥 Action
            </button>

            <button onclick="filterMovies('Adventure')">
                🗺️ Adventure
            </button>

            <button onclick="filterMovies('Sci-Fi')">
                🚀 Sci-Fi
            </button>

            <button onclick="filterMovies('Thriller')">
                🌀 Thriller
            </button>

        </div>


        <div class="movie-grid">

            <div class="movie-card">
                <div class="poster">🎬</div>
                <h3>Avengers</h3>
                <p>⭐ 8.5 • 2026</p>
                <span class="genre">Action</span>
            </div>

            <div class="movie-card">
                <div class="poster">🕷️</div>
                <h3>Spider-Man</h3>
                <p>⭐ 8.2 • 2025</p>
                <span class="genre">Adventure</span>
            </div>

            <div class="movie-card">
                <div class="poster">🚀</div>
                <h3>Interstellar</h3>
                <p>⭐ 8.8 • 2024</p>
                <span class="genre">Sci-Fi</span>
            </div>

            <div class="movie-card">
                <div class="poster">🌀</div>
                <h3>Inception</h3>
                <p>⭐ 9.0 • 2023</p>
                <span class="genre">Thriller</span>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
